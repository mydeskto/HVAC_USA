services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: addisonairsolution
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - caddy_data:/data
      - caddy_config:/config

